name: toolsets

on:
  push:
    branches: [main]
    paths: [toolsets/**, .github/workflows/toolsets.yml]
  pull_request:
    paths: [toolsets/**, .github/workflows/toolsets.yml]

permissions:
  contents: read

jobs:
  # Builds each Kagent harness image with a toolset added, and publishes it
  # from main as ghcr.io/airohq/agent-harnesses/<name>, tagged with the commit.
  # Kagent runs harness images by digest, so nothing uses a moving tag. When
  # Kagent upgrades, update the harness digests below.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: claude-go
            toolset: go
            harness: ghcr.io/kagent-dev/kagent/claude-harness:1.0.0-rc3@sha256:216613bf155d3d437765675144fee19c9045cb21cd2e481189f2dcae36c24b3b
            check: go version && claude --version && test -r /etc/claude-code/managed-settings.json
          - name: codex-go
            toolset: go
            harness: ghcr.io/kagent-dev/kagent/codex-harness:1.0.0-rc3@sha256:84c3275e36c0d98472a8b930a628e47e08277e7ce4438908e2a44fd1d8a9efd2
            check: go version && codex --version
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Checks the tools run on the runner's platform before anything is
      # published.
      - uses: docker/build-push-action@v7
        with:
          context: toolsets
          file: toolsets/${{ matrix.toolset }}/Dockerfile
          build-args: HARNESS=${{ matrix.harness }}
          load: true
          tags: ${{ matrix.name }}:test
      - run: docker run --rm --entrypoint sh ${{ matrix.name }}:test -c '${{ matrix.check }}'
      - id: build
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: toolsets
          file: toolsets/${{ matrix.toolset }}/Dockerfile
          build-args: HARNESS=${{ matrix.harness }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.name }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - if: github.event_name == 'push'
        run: echo "Image ghcr.io/${{ github.repository }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
