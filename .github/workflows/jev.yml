name: jev

on:
  push:
    branches: [main]
    paths: [jev/**, .github/workflows/jev.yml]
  pull_request:
    paths: [jev/**, .github/workflows/jev.yml]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: jev/go.mod
          cache-dependency-path: jev/go.sum
      - run: go vet ./...
      - run: go test -race ./...

  # Publishes ghcr.io/airohq/agent-harnesses/jev from main, tagged with the
  # commit. Kagent runs harness images by digest, so nothing uses a moving tag.
  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: jev
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/jev:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - run: echo "Image ghcr.io/${{ github.repository }}/jev@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
